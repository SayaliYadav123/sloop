<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>SLOOP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />


  <style>

    /* =====================================================
       ROOT
    ====================================================== */

    :root {
      --paper: #E7E4DD;
      --ink: #171514;
    }


    /* =====================================================
       RESET
    ====================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--paper);
    }

    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================================
       PAGE
    ====================================================== */

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      background: var(--paper);

      overflow: hidden;

      isolation: isolate;
    }


    /* =====================================================
       SMOKE - BOTTOM LEFT
    ====================================================== */

    .page::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: 0;

      width: clamp(
        145px,
        16vw,
        260px
      );

      aspect-ratio: 160 / 136;

      background-image:
        url("smoke-effect-transparent.png");

      background-repeat: no-repeat;

      background-position: left bottom;

      background-size: 100% 100%;

      pointer-events: none;

      z-index: 1;
    }


    /* =====================================================
       BRAND
    ====================================================== */

    .brand {
      position: absolute;

      /*
       * Exact reference positioning
       */
      left: 30%;

      top: 22.3%;

      transform: translateX(-50%);

      display: flex;

      flex-direction: column;

      align-items: center;

      z-index: 2;
    }


    /* =====================================================
       LOGO
    ====================================================== */

    .brand-mark {
      width: 130px;

      height: 70px;

      display: block;

      object-fit: contain;

      margin: 0 0 2px 0;

      transform: translateX(-1px);
    }


    /* =====================================================
       SLOOP
    ====================================================== */

    .brand-name {
      font-size: 0.80rem;

      font-weight: 500;

      letter-spacing: 0.20rem;

      line-height: 1;

      text-transform: uppercase;

      transform: translateX(0.10rem);
    }


    /* =====================================================
       NAVIGATION
    ====================================================== */

    .nav {
      position: absolute;

      /*
       * RIGHT-SIDE POSITION
       */
      right: 5.5%;

      top: 51.5%;

      display: flex;

      flex-direction: column;

      align-items: flex-start;

      /*
       * Reduced negative vertical space.
       */
      gap: 1.15rem;

      width: max-content;

      z-index: 3;
    }


    /* =====================================================
       NAV ITEM
    ====================================================== */

    .nav-item {
      display: flex;

      flex-direction: row;

      align-items: center;

      justify-content: flex-start;

      /*
       * Fixed relationship between ink
       * and text.
       */
      gap: 0.55rem;

      width: max-content;

      min-height: 18px;

      color: var(--ink);

      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }


    .nav-item:hover,
    .nav-item:focus-visible {
      opacity: 0.72;

      transform: translateX(-2px);

      outline: none;
    }


    /* =====================================================
       NAV TEXT
    ====================================================== */

    .nav-label {
      display: block;

      /*
       * Smaller editorial size.
       */
      font-size: 0.61rem;

      font-weight: 500;

      line-height: 1.05;

      /*
       * Reduced letter spacing.
       */
      letter-spacing: 0.10rem;

      text-transform: uppercase;

      text-align: left;

      white-space: nowrap;

      /*
       * Keeps text vertically centered
       * with the ink line.
       */
      transform: translateY(-0.02rem);
    }


    /* =====================================================
       CATALOGUE TWO-LINE TEXT
    ====================================================== */

    .nav-item:first-child .nav-label {
      line-height: 0.95;

      letter-spacing: 0.095rem;

      transform: translateY(-0.08rem);
    }


    /* =====================================================
       INK MARK CONTAINER

       IMPORTANT:
       All five marks have exactly the same
       width and therefore remain aligned.
    ====================================================== */

    .nav-mark {
      position: relative;

      width: 76px;

      height: 18px;

      display: block;

      flex: 0 0 76px;

      margin: 0;

      background: transparent;
    }


    /* =====================================================
       BASIC INK LINE
    ====================================================== */

    .nav-mark::before {
      content: "";

      position: absolute;

      left: 0;

      right: 0;

      top: 8px;

      height: 1.15px;

      border-radius: 100%;

      background:
        linear-gradient(
          90deg,
          rgba(18, 17, 16, 0.96) 0%,
          rgba(18, 17, 16, 0.88) 10%,
          rgba(18, 17, 16, 0.68) 35%,
          rgba(18, 17, 16, 0.48) 65%,
          rgba(18, 17, 16, 0.16) 92%,
          rgba(18, 17, 16, 0) 100%
        );
    }


    /* =====================================================
       BASIC INK HEAD
    ====================================================== */

    .nav-mark::after {
      content: "";

      position: absolute;

      left: -2px;

      top: 3px;

      width: 15px;

      height: 13px;

      border-radius:
        47% 58% 42% 63%;

      background:
        radial-gradient(
          ellipse at 45% 50%,
          rgba(12, 11, 10, 0.98) 0%,
          rgba(12, 11, 10, 0.90) 30%,
          rgba(12, 11, 10, 0.62) 55%,
          rgba(12, 11, 10, 0.20) 73%,
          transparent 85%
        );
    }


    /* =====================================================
       CATALOGUE
    ====================================================== */

    .nav-item:nth-child(1) .nav-mark::after {
      left: -4px;

      top: 5px;

      width: 19px;

      height: 9px;

      border-radius:
        65% 42% 58% 35%;

      background:
        radial-gradient(
          ellipse at 45% 50%,
          rgba(8, 8, 7, 1) 0%,
          rgba(8, 8, 7, 0.94) 30%,
          rgba(8, 8, 7, 0.65) 52%,
          rgba(8, 8, 7, 0.22) 72%,
          transparent 88%
        );

      transform:
        rotate(-2deg)
        scaleX(1.15);
    }


    .nav-item:nth-child(1) .nav-mark::before {
      top: 8px;

      height: 1.1px;

      background:
        linear-gradient(
          90deg,
          rgba(8, 8, 7, 0.95) 0%,
          rgba(8, 8, 7, 0.86) 12%,
          rgba(8, 8, 7, 0.68) 38%,
          rgba(8, 8, 7, 0.46) 67%,
          rgba(8, 8, 7, 0.14) 92%,
          transparent 100%
        );
    }


    /* =====================================================
       JOURNAL
    ====================================================== */

    .nav-item:nth-child(2) .nav-mark::after {
      left: -3px;

      top: 5px;

      width: 14px;

      height: 7px;

      border-radius:
        75% 28% 65% 38%;

      background:
        radial-gradient(
          ellipse at 35% 50%,
          rgba(15, 14, 13, 0.95) 0%,
          rgba(15, 14, 13, 0.65) 35%,
          rgba(15, 14, 13, 0.25) 60%,
          transparent 85%
        );

      transform:
        rotate(-12deg);
    }


    .nav-item:nth-child(2) .nav-mark::before {
      height: 1px;

      background:
        linear-gradient(
          90deg,
          rgba(20, 19, 18, 0.88) 0%,
          rgba(20, 19, 18, 0.68) 12%,
          rgba(20, 19, 18, 0.55) 35%,
          rgba(20, 19, 18, 0.38) 70%,
          rgba(20, 19, 18, 0.10) 94%,
          transparent 100%
        );
    }


    /* =====================================================
       WEBSITE
    ====================================================== */

    .nav-item:nth-child(3) .nav-mark {
      background:

        radial-gradient(
          circle at 4px 4px,
          rgba(12, 11, 10, 0.82) 0 1px,
          transparent 1.6px
        ),

        radial-gradient(
          circle at 8px 14px,
          rgba(12, 11, 10, 0.65) 0 0.8px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 14px 12px,
          rgba(12, 11, 10, 0.48) 0 0.7px,
          transparent 1.4px
        ),

        radial-gradient(
          circle at 5px 16px,
          rgba(12, 11, 10, 0.38) 0 0.7px,
          transparent 1.5px
        );
    }


    .nav-item:nth-child(3) .nav-mark::after {
      left: -3px;

      top: 3px;

      width: 16px;

      height: 15px;

      border-radius:
        42% 58% 48% 63%;

      background:
        radial-gradient(
          circle at 48% 48%,
          rgba(5, 5, 4, 0.98) 0%,
          rgba(5, 5, 4, 0.86) 28%,
          rgba(5, 5, 4, 0.50) 47%,
          rgba(5, 5, 4, 0.15) 65%,
          transparent 80%
        );

      transform: rotate(8deg);
    }


    /* =====================================================
       CONTACT
    ====================================================== */

    .nav-item:nth-child(4) .nav-mark::after {
      left: -1px;

      top: 1px;

      width: 9px;

      height: 17px;

      border-radius:
        55% 40% 48% 35%;

      background:
        linear-gradient(
          90deg,
          rgba(8, 7, 7, 0.95),
          rgba(8, 7, 7, 0.58) 55%,
          transparent
        );

      transform:
        rotate(3deg)
        skewY(-5deg);
    }


    /* =====================================================
       SOCIALS
    ====================================================== */

    .nav-item:nth-child(5) .nav-mark::after {
      left: -2px;

      top: 3px;

      width: 13px;

      height: 13px;

      border-radius:
        60% 32% 55% 30%;

      background:
        linear-gradient(
          78deg,
          rgba(5, 5, 4, 0.98) 0%,
          rgba(5, 5, 4, 0.82) 38%,
          rgba(5, 5, 4, 0.42) 63%,
          transparent 85%
        );

      transform:
        rotate(-18deg)
        skewX(-8deg);
    }


    /* =====================================================
       DESKTOP
    ====================================================== */

    @media (min-width: 1200px) {

      .brand {
        left: 30%;
        top: 22%;
      }

      .brand-mark {
        width: 150px;
        height: 76px;
      }

      .brand-name {
        font-size: 0.88rem;
        letter-spacing: 0.25rem;
      }

      .nav {
        right: 8%;
        top: 59.5%;

        gap: 1.7rem;
      }

      .nav-mark {
        width: 100px;
        flex-basis: 100px;
      }

      .nav-label {
        font-size: 0.78rem;
        letter-spacing: 0.15rem;
      }

      .nav-item:first-child .nav-label {
        letter-spacing: 0.14rem;
      }

      .page::after {
        width: 240px;
      }
    }


    /* =====================================================
       TABLET
    ====================================================== */

    @media (max-width: 980px) {

      .brand {
        left: 30%;
        top: 20%;
      }

      .brand-mark {
        width: 145px;
        height: 74px;
      }

      .brand-name {
        font-size: 0.86rem;
        letter-spacing: 0.23rem;
      }

      .nav {
        right: 7%;
        top: 57%;

        gap: 1.5rem;
      }

      .nav-item {
        gap: 0.65rem;
      }

      .nav-mark {
        width: 88px;
        flex-basis: 88px;
      }

      .nav-label {
        font-size: 0.69rem;
        letter-spacing: 0.13rem;
      }

      .page::after {
        width: 200px;
      }
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 768px) {

      .brand {
        left: 30%;
        top: 21%;
      }

      .brand-mark {
        width: 140px;
        height: 72px;
      }

      .brand-name {
        font-size: 0.84rem;
        letter-spacing: 0.22rem;
      }

      .nav {
        right: 6%;
        top: 54%;

        gap: 1.3rem;
      }

      .nav-item {
        gap: 0.6rem;
      }

      .nav-mark {
        width: 82px;
        flex-basis: 82px;
      }

      .nav-label {
        font-size: 0.66rem;
        letter-spacing: 0.115rem;
      }

      .nav-item:first-child .nav-label {
        letter-spacing: 0.105rem;
      }

      .page::after {
        width: 170px;
      }
    }


    /* =====================================================
       SMALL MOBILE
    ====================================================== */

    @media (max-width: 520px) {

      .brand {
        left: 30%;
        top: 22.3%;
      }

      .brand-mark {
        width: 130px;
        height: 70px;
      }

      .brand-name {
        font-size: 0.80rem;
        letter-spacing: 0.20rem;
      }

      .nav {
        right: 5.5%;
        top: 51.5%;

        gap: 1.15rem;
      }

      .nav-item {
        gap: 0.55rem;
      }

      .nav-mark {
        width: 76px;
        flex-basis: 76px;
      }

      .nav-label {
        font-size: 0.61rem;
        letter-spacing: 0.10rem;
      }

      .nav-item:first-child .nav-label {
        letter-spacing: 0.095rem;
      }

      .page::after {
        width: 155px;
      }
    }


    /* =====================================================
       VERY SMALL PHONE
    ====================================================== */

    @media (max-width: 380px) {

      .brand {
        left: 29%;
        top: 21%;
      }

      .brand-mark {
        width: 120px;
        height: 66px;
      }

      .brand-name {
        font-size: 0.76rem;
        letter-spacing: 0.18rem;
      }

      .nav {
        right: 5%;
        top: 51%;

        gap: 1rem;
      }

      .nav-item {
        gap: 0.5rem;
      }

      .nav-mark {
        width: 70px;
        flex-basis: 70px;
      }

      .nav-label {
        font-size: 0.57rem;
        letter-spacing: 0.085rem;
      }

      .page::after {
        width: 145px;
      }
    }

  </style>
</head>


<body>

  <main
    class="page"
    aria-label="SLOOP homepage"
  >

    <!-- ===================================================
         BRAND
    ==================================================== -->

    <header
      class="brand"
      aria-label="SLOOP brand"
    >

      <img
        class="brand-mark"
        src="logo1.png"
        alt="SLOOP logo"
      />

      <div class="brand-name">
        SLOOP
      </div>

    </header>


    <!-- ===================================================
         NAVIGATION
    ==================================================== -->

    <nav
      class="nav"
      aria-label="Main navigation"
    >

      <a
        class="nav-item"
        href="https://drive.google.com/drive/folders/1IR81Rx1yDNQZYB8iVKQafBD5qyWWlotR"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Catalogue and Linesheet"
      >

        <span
          class="nav-mark"
          aria-hidden="true"
        ></span>

        <span class="nav-label">
          Catalog &amp;<br />
          Linesheet
        </span>

      </a>


      <a
        class="nav-item"
        href="https://slooplife.com/ja/blogs/news"
        aria-label="Journal"
      >

        <span
          class="nav-mark"
          aria-hidden="true"
        ></span>

        <span class="nav-label">
          Journal
        </span>

      </a>


      <a
        class="nav-item"
        href="https://slooplife.com/ja"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Website"
      >

        <span
          class="nav-mark"
          aria-hidden="true"
        ></span>

        <span class="nav-label">
          Website
        </span>

      </a>


      <a
        class="nav-item"
        href="https://slooplife.com/pages/partners-form"
        aria-label="Contact"
      >

        <span
          class="nav-mark"
          aria-hidden="true"
        ></span>

        <span class="nav-label">
          Contact
        </span>

      </a>


      <a
        class="nav-item"
        href="https://www.instagram.com/sloop_life?igsh=ejR5azdjcDducndz"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Socials"
      >

        <span
          class="nav-mark"
          aria-hidden="true"
        ></span>

        <span class="nav-label">
          Socials
        </span>

      </a>

    </nav>

  </main>

</body>
</html>
